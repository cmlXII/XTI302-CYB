# J1 : fail2ban protège SSH
# Lu après defaults-debian.conf (ordre alphabétique), donc ces valeurs gagnent.
# Vérifier la valeur appliquée : fail2ban-client get sshd maxretry
# Débannir une adresse : fail2ban-client set sshd unbanip <IP>

[sshd]
enabled   = true
port      = ssh
# Debian 13 minimale n'a pas de /var/log/auth.log : on lit journald
backend   = systemd
# aggressive : compte aussi les connexions refusées par AllowGroups
# et les tentatives sans mot de passe sur un serveur en clé seule
mode      = aggressive
# 5 échecs en 10 minutes : bannissement de 30 minutes
maxretry  = 5
findtime  = 10m
bantime   = 30m
# Le bannissement passe par nftables (table inet f2b-table)
banaction = nftables
