# Durcissement SSH du serveur Pixelia (exigences S1 à S5)
# Fichier inclus par /etc/ssh/sshd_config. Pour sshd, la première valeur lue
# l'emporte : ce fichier est lu avant le reste du fichier principal.
# Toujours valider avec "sshd -t" avant de recharger, et contrôler avec "sshd -T".

# S1 : clé uniquement, aucun mot de passe
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
AuthenticationMethods publickey

# S2 : pas de connexion directe en root
PermitRootLogin no

# S3 : seuls les membres de acces_ssh peuvent se connecter
AllowGroups acces_ssh

# S4 : 3 essais par connexion, 30 s pour s'authentifier
MaxAuthTries 3
LoginGraceTime 30
# S4 : sshd sonde le client toutes les 300 s ; après 2 sondes sans réponse
# (10 minutes) la connexion est coupée. L'inactivité d'un shell est gérée
# en plus par TMOUT=600 (/etc/profile.d/tmout.sh).
ClientAliveInterval 300
ClientAliveCountMax 2

# Ce dont le serveur n'a pas besoin
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
PermitTunnel no

# Journaux plus détaillés (empreinte de la clé utilisée à chaque connexion)
LogLevel VERBOSE
