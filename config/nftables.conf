#!/usr/sbin/nft -f
# J2 : pare-feu du serveur Pixelia
# Tout ce qui entre est refusé, sauf SSH et les réponses aux connexions déjà
# établies. Chargé au démarrage par le service nftables (règles persistantes).
#
# Pas de "flush ruleset" ici : il effacerait aussi la table de fail2ban
# (inet f2b-table) à chaque rechargement. On vide seulement notre table :
# on la déclare (au cas où elle n'existe pas encore) puis on la supprime.
table inet filtre
delete table inet filtre

table inet filtre {
    chain entree {
        type filter hook input priority filter; policy drop;

        # réponses aux connexions déjà établies
        ct state established,related accept
        ct state invalid drop

        # trafic de la machine vers elle-même (interface loopback)
        iif "lo" accept

        # SSH, le seul service ouvert
        tcp dport 22 ct state new accept
    }

    chain transit {
        # le serveur ne sert pas de routeur
        type filter hook forward priority filter; policy drop;
    }

    chain sortie {
        type filter hook output priority filter; policy accept;
    }
}
