# Complément au service fail2ban (copié dans /etc/systemd/system/fail2ban.service.d/)
# Un "systemctl restart nftables" vide tout le pare-feu (nft flush ruleset),
# y compris la table de fail2ban. PartOf fait redémarrer fail2ban en même
# temps que nftables, ce qui recrée sa table et ses bannissements.
[Unit]
After=nftables.service
PartOf=nftables.service
